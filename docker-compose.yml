services:
  mongo:
    image: mongo:8.2  # not mongo:8: 8.0.x refuses to start on Linux kernels 6.19-7.0.13 (SERVER-121912)
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_RO_PASSWORD: ${MONGO_APP_RO_PASSWORD:?set in .env}
      MONGO_APP_RW_PASSWORD: ${MONGO_APP_RW_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro

volumes:
  mongo-data:
