<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<title>Bisaat Club — Walk the floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Brand colours from the Bisaat Club brand sheet */
:root{--ink:#1F2A44;--cream:#F3EBDD;--walnut:#5A3A24;--amber:#E3A33B;--deep-amber:#C8821B;--wood:#91705A;--espresso:#2B1D15;
  --sheet:var(--cream);--text:var(--espresso);--head:var(--ink);--kick:var(--walnut);--rule:var(--deep-amber);--cta:var(--ink);--cta-text:var(--cream)}
html[data-mode="night"]{--sheet:#1F2A44;--text:#F3EBDD;--head:#F3EBDD;--kick:#E3A33B;--rule:#E3A33B;--cta:#E3A33B;--cta-text:#1F2A44}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#stage{position:fixed;inset:0;display:grid;grid-template:"top" auto "view" minmax(0,1fr) "sheet" auto / minmax(0,1fr)}
#top{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 0 env(safe-area-inset-left);background:var(--ink)}
#brand{height:42px;width:168px;display:block;flex:none}
#right{display:flex;align-items:center;gap:10px}
#open{text-align:right;font-size:12px;line-height:1.35;color:var(--cream)}
#open b{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
#mode{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(243,235,221,.45);border-radius:50%;background:none;color:var(--cream);cursor:pointer}
#mode svg{width:20px;height:20px}
html[data-mode="day"] #moon,html[data-mode="night"] #sun{display:none}
#view{grid-area:view;position:relative;min-height:0;overflow:hidden;background:#141b2c;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;min-height:44px;padding:0;margin:-22px 0 0 -8px;border:0;background:none;color:var(--cream);font:600 13px 'DM Sans',system-ui,sans-serif;cursor:pointer;will-change:transform}
.spot i{width:16px;height:16px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 5px rgba(243,235,221,.28),0 2px 8px rgba(0,0,0,.35);flex:none}
.spot span{padding:5px 11px;border-radius:999px;background:rgba(31,42,68,.92);white-space:nowrap}
.spot.r{flex-direction:row-reverse;margin-left:0}
.spot[hidden]{display:none}
#hint{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(31,42,68,.88);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .6s}
#sheet{grid-area:sheet;position:relative;margin-top:-22px;padding:18px max(20px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:var(--sheet);color:var(--text);border-radius:22px 22px 0 0;z-index:2;transition:background .6s,color .6s}
#copy{min-height:150px}
#kicker{font-size:12px;font-weight:500;color:var(--kick)}
#title{margin:4px 0 0;font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.025em;color:var(--head)}
#rule{width:56px;height:4px;margin:10px 0 0;background:var(--rule)}
#body{margin:10px 0 0;font-size:15px;line-height:1.42}
#price{margin-top:6px;font-size:14px;font-weight:700;color:var(--head)}
#actions{display:grid;grid-template-columns:124px minmax(0,1fr);gap:10px;margin-top:10px}
#next,#book{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font:700 15px 'DM Sans',system-ui,sans-serif;text-decoration:none;cursor:pointer}
#next{border:2px solid var(--head);background:none;color:var(--head)}
#book{border:0;background:var(--cta);color:var(--cta-text)}
#find{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:13px;font-weight:600;color:var(--head);text-align:center}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:32px;text-align:center;font-size:15px;line-height:1.5}
/* Small iPhones (SE, mini): tighten the sheet so the room keeps most of the screen */
@media (max-height:740px){ #copy{min-height:124px} #title{font-size:26px} #rule{margin-top:8px;height:3px} #body{margin-top:8px;font-size:14px} #price{font-size:13px} #next,#book{min-height:48px} #find{min-height:44px} #top{min-height:52px} #brand{height:36px;width:144px} }
@media (max-width:350px){ #open span{display:none} #actions{grid-template-columns:104px minmax(0,1fr)} }
/* Phone held sideways: room on the left, sheet as a column on the right */
@media (orientation:landscape) and (max-height:520px){
  #stage{grid-template:"top top" auto "view sheet" minmax(0,1fr) / minmax(0,1fr) minmax(280px,40%)}
  #sheet{margin:0;border-radius:0;padding-top:14px;overflow:auto} #copy{min-height:0} #title{font-size:24px} #hint{bottom:14px}
}
/* Tablet and desktop: room fills the window, sheet floats */
@media (min-width:860px) and (min-height:521px){
  #stage{grid-template:"top" auto "view" minmax(0,1fr) / minmax(0,1fr)}
  #sheet{position:absolute;left:28px;bottom:28px;width:410px;margin:0;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  #hint{bottom:28px}
}
</style>
</head>

'  vec3 sc=mix(base*0.25,base*1.3+vec3(0.15),smoothstep(0.25,0.8,b1+0.25*(sv-0.5)));emis=sc*(0.55+0.5*night)*mix(0.4,1.0,smoothstep(0.0,0.03,edge));alb=vec3(0.0);}',

'  vec3 nsky=mix(vec3(0.028,0.032,0.06),vec3(0.008,0.011,0.03),smoothstep(0.0,5.0,vP.y-h));vec2 cell=floor(vec2(s*9.0,vP.y*9.0));float lit=step(0.9,hash(cell))*step(vP.y,h-0.1)*step(-2.5,vP.y);',
'  vec3 ngnd=vec3(0.012,0.014,0.022)+lit*vec3(1.0,0.72,0.38)*(0.25+0.6*hash(cell+7.0));',

' else if(m<7.5){if(abs(n.z)>0.5){float row=floor(vP.y/0.35);float fy=fract(vP.y/0.35);float bx=vP.x*24.0+row*7.3;float id=floor(bx);float fx=fract(bx);float h1=hash(vec2(id,row));',
'  if(fy<0.07||vP.y>2.05||vU.x<0.04||vU.x>vU.z-0.04){alb=wal;}else{float top=0.55+0.4*hash(vec2(id+3.0,row));if(fy>top){alb=vec3(0.012,0.008,0.005);}else{',
'  vec3 pal=h1<0.2?vec3(0.45,0.20,0.16):h1<0.4?vec3(0.20,0.27,0.36):h1<0.6?vec3(0.72,0.57,0.28):h1<0.8?vec3(0.22,0.32,0.28):vec3(0.86,0.81,0.71);',

' else if(m<8.5){alb=alb*(1.0+2.5*bev)+0.02*bev;gloss=0.45;rough=0.1;}',

' else{alb*=0.95+0.1*fbm(vP.xy*3.0);if(n.z<-0.5){vec2 uv=vec2((7.25-vP.x)/2.6,(vP.y-1.5)/0.65);if(uv.x>0.0&&uv.x<1.0&&uv.y>0.0&&uv.y<1.0){vec4 t=texture2D(uLogo,uv);alb=mix(alb,lin(t.rgb),t.a);}if(vP.y<0.09)alb=lin(vec3(0.353,0.227,0.141));}}',

'  vec3 L=vec3(1.0,0.86,0.68)*2.2*ndl*sun*uDay;',
'  vec3 tw=normalize(vec3(RW+0.6-vP.x,1.7-vP.y,0.0));float fall=mix(0.30,1.0,exp(-(RW-vP.x)*0.22));vec3 skyc=mix(vec3(0.10,0.13,0.22)*0.18,vec3(0.90,0.93,1.0)*1.35,uDay);L+=skyc*(max(dot(n,tw),0.0)*0.75+0.25)*fall;',
'  vec3 tt=normalize(vec3(9.1-vP.x,1.7-vP.y,-0.4-vP.z));L+=skyc*0.6*(max(dot(n,tt),0.0)*0.75+0.25)*exp(-length(vP.xz-vec2(9.1,0.0))*0.3);',
'  L+=mix(vec3(0.016,0.015,0.016),vec3(0.30,0.28,0.25),uDay)*(0.75+0.25*n.y);L+=vec3(1.0,0.9,0.75)*0.22*uDay*max(-n.y*0.8+0.2,0.0)*fall*smoothstep(3.2,0.0,vP.y);',
'  float lk=mix(0.42,0.26,uDay);for(int i=0;i<'+NL+';i++){vec3 d=uLamp[i].xyz-vP;float r2=dot(d,d);L+=vec3(1.0,0.70,0.40)*uLamp[i].w*lk*(max(dot(n,normalize(d)),0.0)*0.8+0.2)/(0.55+r2);}',
'  vec3 dd=vec3(min(vP.x,RW-vP.x),min(vP.y,2.9-vP.y),min(vP.z,RD-vP.z))+abs(n)*10.0;float ao=mix(0.6,1.0,smoothstep(0.0,0.55,min(dd.x,min(dd.y,dd.z))))*aoM;',
'  if(m<0.5)ao*=contact(vP);else if(abs(n.y)<0.5&&m>2.5&&m<12.0)ao*=mix(0.62,1.0,smoothstep(0.0,0.3,vP.y));',
'  col+=alb*L*ao;',
'  if(gloss>0.0){vec3 R=reflect(-V,n);float F=0.04+0.96*pow(1.0-max(dot(n,V),0.0),5.0);float w=winVis(ps,R,rough);if(w>0.001&&m<0.5)w*=occl(ps,R);',
'   col+=mix(vec3(0.03,0.04,0.07),vec3(1.0,0.97,0.9)*2.4,uDay)*w*F*gloss;for(int i=0;i<'+NL+';i++){col+=vec3(1.0,0.7,0.4)*gloss*F*uLamp[i].w*lk*1.4*pow(max(dot(R,normalize(uLamp[i].xyz-vP)),0.0),220.0);}}',
' }',
' col+=vec3(1.0,0.95,0.85)*0.05*uDay*winVis(uEye,-V,0.3);',

' gl_FragColor=vec4(col,1.0);}'
].join('\n');

/* ---------- WebGL setup ---------- */
var view = document.getElementById('view'), canvas = document.getElementById('gl');
var gl = canvas.getContext('webgl', { antialias:true, alpha:false, powerPreference:'high-performance' });
var ok = !!gl, prog, uPV, uEye, uRes, uDay, dirty = true;
function sh(type, src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); ok=false; } return s; }
if (ok) {
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); ok=false; }
}
if (ok) {
  gl.useProgram(prog);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  [['aP',3,0],['aN',3,12],['aM',1,24],['aC',3,28],['aU',4,40]].forEach(function(a){ var l=gl.getAttribLocation(prog,a[0]); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,a[1],gl.FLOAT,false,56,a[2]); });
  uPV=gl.getUniformLocation(prog,'uPV'); uEye=gl.getUniformLocation(prog,'uEye'); uRes=gl.getUniformLocation(prog,'uRes'); uDay=gl.getUniformLocation(prog,'uDay');
  var mn=[],mx=[],lp=[]; casters.forEach(function(c){ mn.push(c[0][0],c[0][1],c[0][2]); mx.push(c[1][0],c[1][1],c[1][2]); }); LAMPS.forEach(function(l){ lp.push(l[0],l[1],l[2],l[3]); });
  gl.uniform3fv(gl.getUniformLocation(prog,'uBmin'), new Float32Array(mn)); gl.uniform3fv(gl.getUniformLocation(prog,'uBmax'), new Float32Array(mx)); gl.uniform4fv(gl.getUniformLocation(prog,'uLamp'), new Float32Array(lp));
  // The sign on the ink-blue reception wall uses the same logo image as the header
  var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([243,235,221,0]));
  gl.uniform1i(gl.getUniformLocation(prog,'uLogo'),0);
  var logo = new Image(); logo.onload = function(){ gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,logo); gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); dirty = true; };
  logo.src = document.getElementById('brand').src;
  gl.enable(gl.DEPTH_TEST);
} else { document.getElementById('nogl').style.display='flex'; document.getElementById('hint').style.display='none'; }

/* ---------- Light and dark mode ---------- */
var root = document.documentElement, day = 1, dayTarget = 1;
function setMode(night, instant){ root.dataset.mode = night ? 'night' : 'day'; dayTarget = night ? 0 : 1; if (instant) day = dayTarget; dirty = true; }
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
setMode(!!(mq && mq.matches), true);
if (mq && mq.addEventListener) mq.addEventListener('change', function(e){ setMode(e.matches); });
document.getElementById('mode').addEventListener('click', function(){ setMode(root.dataset.mode !== 'night'); });

/* ---------- Camera ---------- */
var EYE = 1.56, RAD = Math.PI/180;
var cam = { x:ZONES.door.cam[0], z:ZONES.door.cam[1], yaw:ZONES.door.yaw, pitch:ZONES.door.pitch, bob:0 };
var look = { yaw:0, pitch:0 }, walk = null, at = 'door', PV = new Float32Array(16), W = 1, H = 1, sharpAt = 0, lowRes = false;
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function mul(a,b){ var o=new Float32Array(16); for(var c=0;c<4;c++)for(var r=0;r<4;r++){ var s=0; for(var k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }
function updateMatrices(){
  var yaw=(cam.yaw+look.yaw)*RAD, pitch=(cam.pitch+look.pitch)*RAD, cp=Math.cos(pitch);
  var f=[Math.sin(yaw)*cp, Math.sin(pitch), -Math.cos(yaw)*cp], r=[Math.cos(yaw),0,Math.sin(yaw)];
  var u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  var e=[cam.x, EYE+cam.bob, cam.z];
  var Vm=new Float32Array([r[0],u[0],-f[0],0, r[1],u[1],-f[1],0, r[2],u[2],-f[2],0, -(r[0]*e[0]+r[1]*e[1]+r[2]*e[2]), -(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]), (f[0]*e[0]+f[1]*e[1]+f[2]*e[2]), 1]);
  var fov=(W<H?72:56)*RAD, t=1/Math.tan(fov/2), n=.05, fr=80;
  var P=new Float32Array([t/(W/H),0,0,0, 0,t,0,0, 0,0,(fr+n)/(n-fr),-1, 0,0,2*fr*n/(n-fr),0]);
  PV=mul(P,Vm); return e;
}
function project(p){ var x=PV[0]*p[0]+PV[4]*p[1]+PV[8]*p[2]+PV[12], y=PV[1]*p[0]+PV[5]*p[1]+PV[9]*p[2]+PV[13], w=PV[3]*p[0]+PV[7]*p[1]+PV[11]*p[2]+PV[15];
  if (w<=.2) return null; return [(x/w*.5+.5)*W, (1-(y/w*.5+.5))*H]; }
/* Render at reduced resolution while moving, then sharpen once still: keeps iPhones smooth */
function sizeCanvas(low){ var dpr=Math.min(window.devicePixelRatio||1, 2)*(low?.55:1); W=view.clientWidth; H=view.clientHeight; var cw=Math.max(2,Math.round(W*dpr)), ch=Math.max(2,Math.round(H*dpr)); if(canvas.width!==cw||canvas.height!==ch){ canvas.width=cw; canvas.height=ch; } lowRes=low; }
window.addEventListener('resize', function(){ sizeCanvas(false); dirty=true; });
if (window.ResizeObserver) new ResizeObserver(function(){ sizeCanvas(lowRes); dirty=true; }).observe(view);
sizeCanvas(false);

/* ---------- Walking ---------- */
var spots = [].slice.call(document.querySelectorAll('.spot'));
function fill(id){ var z=ZONES[id]; document.getElementById('kicker').textContent=z.kicker; document.getElementById('title').textContent=z.title; document.getElementById('body').textContent=z.body; document.getElementById('price').textContent=z.price; }
function go(id){
  if (id===at && !walk) return;
  var z=ZONES[id], dy=((z.yaw-cam.yaw+540)%360)-180, d=Math.hypot(z.cam[0]-cam.x, z.cam[1]-cam.z);
  walk={ t0:performance.now(), dur:reduce?1:Math.max(1500, d*560), x0:cam.x, z0:cam.z, y0:cam.yaw, p0:cam.pitch, x1:z.cam[0], z1:z.cam[1], dy:dy, p1:z.pitch, ly:look.yaw, lp:look.pitch, steps:Math.max(2,Math.round(d/.7)) };
  at=id; fill(id); dirty=true; document.getElementById('hint').style.opacity=0;
}
spots.forEach(function(s){ s.addEventListener('click', function(){ go(s.dataset.go); }); });
document.getElementById('next').addEventListener('click', function(){ go(ORDER[(ORDER.indexOf(at)+1)%ORDER.length]); });
document.getElementById('book').href = BOOKING_URL;
fill('door');
/* Deep links: #lib opens at the reading room, #lib-night opens it in dark mode */
(function(){ var parts=(location.hash||'').slice(1).split('-'), h=parts[0];
  if (parts.indexOf('night')>=0) setMode(true,true); else if (parts.indexOf('day')>=0) setMode(false,true);
  if(ZONES[h]&&h!=='door'){ var z=ZONES[h]; cam.x=z.cam[0]; cam.z=z.cam[1]; cam.yaw=z.yaw; cam.pitch=z.pitch; at=h; fill(h); document.getElementById('hint').style.display='none'; } })();

/* ---------- Looking around ---------- */
var drag=null;
view.addEventListener('pointerdown', function(e){ if (e.target.closest('.spot')) return; drag={x:e.clientX,y:e.clientY,yaw:look.yaw,pitch:look.pitch}; });
window.addEventListener('pointermove', function(e){ if(!drag||walk) return; look.yaw=Math.max(-80,Math.min(80,drag.yaw-(e.clientX-drag.x)*.22)); look.pitch=Math.max(-22,Math.min(22,drag.pitch+(e.clientY-drag.y)*.16)); dirty=true; document.getElementById('hint').style.opacity=0; });
window.addEventListener('pointerup', function(){ drag=null; }); window.addEventListener('pointercancel', function(){ drag=null; });

/* ---------- Frame loop (renders only when something changed) ---------- */
function ease(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function frame(now){
  var moving = !!walk || !!drag || day!==dayTarget;
  if (walk){ var t=Math.min(1,(now-walk.t0)/walk.dur), k=ease(t);
    cam.x=walk.x0+(walk.x1-walk.x0)*k; cam.z=walk.z0+(walk.z1-walk.z0)*k; cam.yaw=walk.y0+walk.dy*k; cam.pitch=walk.p0+(walk.p1-walk.p0)*k;
    look.yaw=walk.ly*(1-k); look.pitch=walk.lp*(1-k); cam.bob=reduce?0:Math.sin(k*Math.PI*walk.steps)*.02*Math.sin(t*Math.PI);
    if (t>=1){ walk=null; cam.bob=0; } dirty=true; }
  if (day!==dayTarget){ day += Math.sign(dayTarget-day)*Math.min(Math.abs(dayTarget-day), reduce?1:.035); dirty=true; }
  if (moving){ sharpAt = now+140; if(!lowRes){ sizeCanvas(true); } }
  else if (lowRes && now>sharpAt){ sizeCanvas(false); dirty=true; }
  if (dirty && ok){ dirty=false; var e=updateMatrices();
    gl.viewport(0,0,canvas.width,canvas.height); gl.clearColor(.05,.03,.02,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uPV,false,PV); gl.uniform3f(uEye,e[0],e[1],e[2]); gl.uniform2f(uRes,canvas.width,canvas.height); gl.uniform1f(uDay,day);
    gl.drawArrays(gl.TRIANGLES,0,verts.length/14);
    var placed=[], nl=0, nr=0, desk=(W>=860&&H>=521), yawNow=cam.yaw+look.yaw;
    spots.forEach(function(s){ var id=s.dataset.go, a=ZONES[id].at;
      if(id===at&&!walk){ s.hidden=true; return; }
      var p=project(a), on=p&&p[0]>=14&&p[0]<=W-120&&p[1]>=30&&p[1]<=H-50&&!(desk&&p[0]<460&&p[1]>H-340);
      s.hidden=false;
      if(on){ for(var i=0;i<placed.length;i++){ if(Math.abs(placed[i][0]-p[0])<150&&Math.abs(placed[i][1]-p[1])<44){ p[1]=placed[i][1]+(p[1]>=placed[i][1]?46:-46); } }
        placed.push(p); s.classList.remove('r'); s.style.transform='translate('+p[0].toFixed(1)+'px,'+p[1].toFixed(1)+'px)'; }
      else { var b=Math.atan2(a[0]-cam.x, -(a[2]-cam.z))/RAD-yawNow; b=((b+540)%360)-180;
        var left=(b<0&&!desk), y=H*.5+46*(left?nl++:nr++), x=left?18:W-10;
        for(var i=0;i<placed.length;i++){ if(Math.abs(placed[i][0]-(left?x:x-130))<170&&Math.abs(placed[i][1]-y)<40){ y=placed[i][1]+46; if(left)nl++; else nr++; } }
        placed.push([left?x:x-130,y]);
        if(left){ s.classList.remove('r'); s.style.transform='translate('+x+'px,'+y+'px)'; }
        else { s.classList.add('r'); s.style.transform='translate('+x+'px,'+y+'px) translateX(-100%)'; } } }); }
  requestAnimationFrame(frame);
}
if (!ok) spots.forEach(function(s){ s.hidden=true; });
requestAnimationFrame(frame);

/* ---------- Countdown ---------- */
function tick(){ var m=Math.max(0,Math.floor((OPENING-Date.now())/60000)); document.getElementById('count').textContent=Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h '+(m%60)+'m to go'; }
tick(); setInterval(tick, 30000);
</script>
